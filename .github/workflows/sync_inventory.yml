name: Sync inventory
run-name: "Sync inventory"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  sync-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust toolchain
        run: rustup update
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cargo build
        run: cargo build --locked
      - name: Sync inventory
        run: |
          set -euo pipefail
          cargo run --locked --bin inventory_sync 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
