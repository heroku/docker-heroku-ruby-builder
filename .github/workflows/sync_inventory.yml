name: Sync inventory
run-name: "Sync inventory"

on:
  workflow_dispatch:
    inputs:
      rebuild_checksums:
          description: "Regenerate all checksums"
          type: boolean
          default: false
          required: false
  workflow_call:
    secrets:
      LINGUIST_GH_PRIVATE_KEY:
        required: true

# The GitHub App token is used instead.
permissions: {}

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  sync-inventory:
    runs-on: pub-hk-ubuntu-24.04-ip
    timeout-minutes: 15
    # Shared by every job that writes the inventory and pushes the sync branch
    concurrency:
      group: sync-inventory
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ vars.LINGUIST_GH_APP_ID }}
          private-key: ${{ secrets.LINGUIST_GH_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The PR targets main, not the branch or commit that started the run
          ref: main
          token: ${{ steps.generate-token.outputs.token }}
      - name: Update Rust toolchain
        run: rustup update
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cargo build
        run: cargo build --locked
      - name: Sync inventory
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          cargo run --locked --bin inventory_sync -- ${{ inputs.rebuild_checksums && '--rebuild-checksums' || '' }} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          title: "Sync inventory"
          commit-message: "Sync inventory"
          branch: sync-inventory
          add-paths: |
            ruby_inventory.toml
            jruby_inventory.toml
          body: "Automated pull request to add the artifacts on Heroku S3 that are missing from the inventory."
          committer: ${{ vars.LINGUIST_GH_APP_USERNAME }} <${{ vars.LINGUIST_GH_APP_EMAIL }}>
          author: ${{ vars.LINGUIST_GH_APP_USERNAME }} <${{ vars.LINGUIST_GH_APP_EMAIL }}>
      - name: Configure PR for auto-merge
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --squash --auto "$PR_NUMBER"
      - name: Fail if the sync had errors
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Inventory sync had errors. See the Sync inventory step."
          exit 1
