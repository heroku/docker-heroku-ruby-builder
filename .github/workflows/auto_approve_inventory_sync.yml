name: Auto-approve inventory sync PRs

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'heroku-linguist[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'inventory-sync/')
    runs-on: pub-hk-ubuntu-24.04-ip # The heroku org IP allow list rejects API calls from GitHub-hosted runners
    steps:
      - name: Check that only inventory files changed
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.files[].filename')
          OTHER_FILES=$(grep -v -x -E '(ruby|jruby)_inventory\.toml' <<<"$FILES" || true)
          if [ -n "$OTHER_FILES" ]; then
            echo "Files other than the inventory changed:"
            echo "$OTHER_FILES"
            exit 1
          fi
      - name: Approve PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr review --approve "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
      - name: Disable auto-merge
        if: failure() && steps.files.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge --disable-auto "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
