name: Update Ruby Support article

on:
  schedule:
    - cron: '0 14 * * *' # Daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-support-article
  cancel-in-progress: false

jobs:
  update-support-article:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust toolchain
        run: rustup update
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cargo build
        run: cargo build --locked
      - name: Publish version tables
        env:
          HEROKU_DEVCENTER_API_TOKEN: ${{ secrets.HEROKU_DEVCENTER_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo run --locked --bin support_article -- publish \
            --gh-token "$GITHUB_TOKEN" \
            --minimum-ruby-series 3.1 \
            --minimum-jruby-version 9.4 \
            --summary-file "$GITHUB_STEP_SUMMARY"
