name: Build and upload Ruby runtime
run-name: "Build and upload Ruby ${{ inputs.ruby_version }}${{ inputs.dry_run && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      ruby_version:
          description: "The Ruby version to build, specified as X.Y.Z"
          type: string
          required: true
      on_conflict:
          description: "Behavior when the artifact already exists in S3 (or locally)"
          type: choice
          options:
            - skip
            - overwrite
          default: skip
          required: true
      dry_run:
          description: "Skip deploying to S3 (e.g. for testing)"
          type: boolean
          default: false
          required: false
      publish_changelog:
          description: "Publish the Dev Center changelog after builds (when disabled, no entry is created)"
          type: boolean
          default: false
          required: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: "us-east-1"
  S3_BUCKET: "heroku-buildpack-ruby"

jobs:
  changelog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust toolchain
        run: rustup update
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cargo build
        run: cargo build --locked
      - name: Output CHANGELOG
        run: |
            set -euo pipefail
            {
              # 4 backticks so the inner ```ruby fences in the changelog render literally
              echo '````'
              cargo run --locked --bin ruby_changelog -- print --version "${{inputs.ruby_version}}"
              echo '````'
            } | tee -a "$GITHUB_STEP_SUMMARY"

  build-and-upload:
    runs-on: ${{ matrix.arch == 'arm64' && 'pub-hk-ubuntu-24.04-arm-xlarge' || 'pub-hk-ubuntu-24.04-xlarge' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ["amd64", "arm64"]
        base_image: ["heroku-22", "heroku-24", "heroku-26"]
        exclude:
          - base_image: "heroku-22"
            arch: "arm64"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust toolchain
        run: rustup update
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cargo build
        run: cargo build --locked
      - name: Build Ruby
        id: build
        run: |
          cargo run --locked --bin ruby_build -- \
            --version ${{inputs.ruby_version}} \
            --base-image ${{matrix.base_image}} \
            --arch ${{matrix.arch}} \
            --on-conflict ${{inputs.on_conflict}} \
            --artifact-dir ./output \
            --cache-dir ./cache \
            --job-metadata "$GITHUB_OUTPUT"
      - name: Check Ruby
        if: steps.build.outputs.status == 'success'
        run: |
          cargo run --locked --bin ruby_check -- \
            --version ${{inputs.ruby_version}} \
            --base-image ${{matrix.base_image}} \
            --arch ${{matrix.arch}} \
            --artifact-dir ./output \
            | tee -a $GITHUB_STEP_SUMMARY
      - name: Upload Ruby runtime archive to S3
        if: steps.build.outputs.status == 'success'
        run: aws s3 sync ./output "s3://${S3_BUCKET}" ${{ case(inputs.dry_run, '--dryrun', '') }}
      # Marks that a real build happened; matrix job outputs are racy across legs, so create-changelog checks for this artifact instead.
      - name: Create build marker
        if: steps.build.outputs.status == 'success'
        run: echo "${{ matrix.base_image }} ${{ matrix.arch }}" > build-marker.txt
      - name: Upload build marker
        if: steps.build.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build-marker-${{ matrix.base_image }}-${{ matrix.arch }}
          path: build-marker.txt
          if-no-files-found: error

  create-changelog:
    needs: build-and-upload
    if: ${{ success() && !inputs.dry_run && inputs.publish_changelog }}
    runs-on: ubuntu-24.04
    env:
      HEROKU_DEVCENTER_API_TOKEN: ${{ secrets.HEROKU_DEVCENTER_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust toolchain
        run: rustup update
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cargo build
        run: cargo build --locked
      # A build marker only exists after a real build; matrix success() is also true when every leg just skipped.
      - name: Download build markers
        id: download-markers
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: build-marker-*
          path: ./build-markers
          merge-multiple: true
      - name: Check for a real build
        id: gate
        run: |
          set -euo pipefail
          if [ -d ./build-markers ] && [ -n "$(ls -A ./build-markers)" ]; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Dev Center changelog
        if: steps.gate.outputs.has_build == 'true'
        run: |
          set -euo pipefail
          cargo run --locked --bin ruby_changelog -- devcenter \
            --version ${{inputs.ruby_version}} \
            --status published
      - name: Skip changelog publish
        if: steps.gate.outputs.has_build != 'true'
        run: echo "No new build produced in this run; skipping changelog publish."
