name: Check for new Ruby and JRuby releases
run-name: "Check for new Ruby and JRuby releases"

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch:
    inputs:
      dry_run:
          description: "Print what would be triggered without actually dispatching builds"
          type: boolean
          default: false
          required: false

permissions:
  contents: read
  actions: write

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check-releases:
    runs-on: pub-hk-ubuntu-24.04-ip # `gh workflow run` needs to be in an IP allow list
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Restore prebuilt ruby_release_check
        id: prebuilt
        uses: actions/cache@v6
        with:
          path: prebuilt/ruby_release_check
          key: ruby_release_check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/*.rs') }}
      - name: Update Rust toolchain
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: rustup update
      - name: Rust Cache
        if: steps.prebuilt.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cargo build
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --bin ruby_release_check
          install -D target/debug/ruby_release_check prebuilt/ruby_release_check
      - name: Check for missing Ruby versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          prebuilt/ruby_release_check \
            --minimum-version 3.2.1 \
            --output versions.json \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Trigger builds for missing versions
        # Generating the versions list can partially succeed: some versions
        # resolve while others fail. `!cancelled()` lets this step run even when
        # the check step failed, so the versions that did succeed still get
        # dispatched. The job's overall status stays failed so we know to look.
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONS=$(jq -r '.[]' versions.json)
          if [ -z "$VERSIONS" ]; then
            echo "No versions to build"
            exit 0
          fi
          echo "$VERSIONS" | while IFS= read -r version; do
            echo "Triggering build for Ruby $version"
            gh workflow run build_ruby.yml \
              -f ruby_version="$version" \
              -f on_conflict=skip \
              -f publish_changelog=true
          done

  check-jruby-releases:
    runs-on: pub-hk-ubuntu-24.04-ip # `gh workflow run` needs to be in an IP allow list
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Restore prebuilt jruby_release_check
        id: prebuilt
        uses: actions/cache@v6
        with:
          path: prebuilt/jruby_release_check
          key: jruby_release_check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/*.rs') }}
      - name: Update Rust toolchain
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: rustup update
      - name: Rust Cache
        if: steps.prebuilt.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cargo build
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --bin jruby_release_check
          install -D target/debug/jruby_release_check prebuilt/jruby_release_check
      - name: Check for missing JRuby versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          prebuilt/jruby_release_check \
            --minimum-version 9.4.7.0 \
            --output jruby_versions.json \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Trigger builds for missing versions
        # Generating the versions list can partially succeed: some versions
        # resolve while others fail. `!cancelled()` lets this step run even when
        # the check step failed, so the versions that did succeed still get
        # dispatched. The job's overall status stays failed so we know to look.
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONS=$(jq -r '.[]' jruby_versions.json)
          if [ -z "$VERSIONS" ]; then
            echo "No JRuby versions to build"
            exit 0
          fi
          echo "$VERSIONS" | while IFS= read -r version; do
            echo "Triggering build for JRuby $version"
            gh workflow run build_jruby.yml \
              -f jruby_version="$version" \
              -f on_conflict=skip \
              -f publish_changelog=true
          done
