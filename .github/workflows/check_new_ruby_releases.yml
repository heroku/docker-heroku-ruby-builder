name: Check for new Ruby and JRuby releases
run-name: "Check for new Ruby and JRuby releases"

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch:
    inputs:
      dry_run:
          description: "Sync the inventories without dispatching builds or opening PRs"
          type: boolean
          default: false
          required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-ruby:
    uses: ./.github/workflows/sync_inventory.yml
    secrets:
      LINGUIST_GH_PRIVATE_KEY: ${{ secrets.LINGUIST_GH_PRIVATE_KEY }}
    with:
      runtime: ruby
      open_pr: ${{ !inputs.dry_run }}
      trigger_builds: ${{ !inputs.dry_run }}

  sync-jruby:
    uses: ./.github/workflows/sync_inventory.yml
    secrets:
      LINGUIST_GH_PRIVATE_KEY: ${{ secrets.LINGUIST_GH_PRIVATE_KEY }}
    with:
      runtime: jruby
      open_pr: ${{ !inputs.dry_run }}
      trigger_builds: ${{ !inputs.dry_run }}
